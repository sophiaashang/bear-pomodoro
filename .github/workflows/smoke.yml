name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run smoke test
        run: python -u tests/smoke_test.py
        timeout-minutes: 5
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ matrix.os }}
          path: smoke_screen.png
          if-no-files-found: ignore
